<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111e"/>
      <stop offset="50%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="8" opacity="0.6"/>

  <!-- Snowflake / Cold Cooling Accent -->
  <g stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="200" y1="130" x2="200" y2="250"/>
    <line x1="140" y1="190" x2="260" y2="190"/>
    <line x1="158" y1="148" x2="242" y2="232"/>
    <line x1="158" y1="232" x2="242" y2="148"/>
    <!-- Snowflake branches -->
    <path d="M 188 150 L 200 162 L 212 150 M 188 230 L 200 218 L 212 230"/>
    <path d="M 160 178 L 172 190 L 160 202 M 240 178 L 228 190 L 240 202"/>
  </g>

  <!-- Electric Flame / Spark Energy -->
  <path d="M 285 240 C 270 200 310 160 315 125 C 335 155 375 170 365 210 C 390 185 385 145 370 115 C 410 160 415 220 380 265 C 360 290 315 285 285 240 Z" fill="url(#flameGrad)" opacity="0.95" filter="url(#glow)"/>
  <polygon points="340,110 315,180 345,180 325,245 380,165 345,165" fill="#ffffff" opacity="0.95"/>

  <!-- High Tech Wrench Tool -->
  <g transform="rotate(-38 245 285)">
    <!-- Wrench Handle -->
    <rect x="220" y="220" width="50" height="200" rx="25" fill="url(#wrenchGrad)" stroke="#38bdf8" stroke-width="5"/>
    <rect x="235" y="270" width="20" height="90" rx="10" fill="#07111e" opacity="0.6"/>
    <!-- Wrench Head -->
    <path d="M 200 230 C 180 180 210 120 270 120 C 310 120 330 145 330 145 L 295 180 C 295 180 280 165 265 170 C 245 175 240 195 245 210 L 215 235 Z" fill="url(#wrenchGrad)" stroke="#38bdf8" stroke-width="5"/>
  </g>

  <!-- Glowing Accent dot -->
  <circle cx="340" cy="115" r="7" fill="#ffffff" filter="url(#glow)"/>
</svg>
